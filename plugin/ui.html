<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KingCrab - PAM Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 20px;
      color: #e4e4e7;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #f472b6 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #a1a1aa;
      font-size: 1rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-value.pending { color: #fbbf24; }
    .stat-value.approved { color: #34d399; }
    .stat-value.denied { color: #f87171; }

    .stat-label {
      color: #a1a1aa;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .requests-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .request-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      border-left: 4px solid;
      backdrop-filter: blur(10px);
      transition: transform 0.2s;
    }

    .request-card:hover {
      transform: translateX(5px);
    }

    .request-card.status-pending { border-left-color: #fbbf24; }
    .request-card.status-approved { border-left-color: #34d399; }
    .request-card.status-denied { border-left-color: #f87171; }

    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .request-id {
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.9rem;
      color: #a1a1aa;
    }

    .request-status {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pending { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
    .status-approved { background: rgba(52, 211, 153, 0.2); color: #34d399; }
    .status-denied { background: rgba(248, 113, 113, 0.2); color: #f87171; }

    .request-command {
      font-family: 'Monaco', 'Menlo', monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      word-break: break-all;
    }

    .request-reason {
      color: #a1a1aa;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .request-reason::before {
      content: "Reason: ";
      font-weight: 600;
      color: #e4e4e7;
    }

    .request-time {
      color: #71717a;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    .request-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-approve {
      background: #34d399;
      color: #022c22;
    }

    .btn-approve:hover {
      background: #10b981;
      transform: translateY(-2px);
    }

    .btn-deny {
      background: #f87171;
      color: #450a0a;
    }

    .btn-deny:hover {
      background: #ef4444;
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #71717a;
    }

    .empty-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #a1a1aa;
    }

    .loading::after {
      content: '...';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    .error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid #f87171;
      border-radius: 8px;
      padding: 15px;
      color: #f87171;
      text-align: center;
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e4e4e7;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-bottom: 20px;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🦀 KingCrab</h1>
      <p class="subtitle">Privileged Access Management for OpenClaw</p>
    </header>

    <div id="app">
      <button class="refresh-btn" onclick="fetchRequests()">🔄 Refresh</button>

      <div id="stats" class="stats"></div>
      <div id="requests" class="requests-list"></div>
      <div id="error" class="error" style="display: none;"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8080';

    async function fetchRequests() {
      const requestsEl = document.getElementById('requests');
      const statsEl = document.getElementById('stats');
      const errorEl = document.getElementById('error');

      // Show loading state
      requestsEl.innerHTML = '<div class="loading">Loading requests</div>';
      errorEl.style.display = 'none';

      try {
        const response = await fetch(`${API_BASE}/requests`);
        if (!response.ok) throw new Error('Failed to fetch requests');

        const data = await response.json();
        const requests = data.requests || [];

        renderStats(requests);
        renderRequests(requests);
      } catch (err) {
        console.error('Error fetching requests:', err);
        errorEl.textContent = `Error: ${err.message}. Make sure the KingCrab daemon is running on ${API_BASE}`;
        errorEl.style.display = 'block';
        requestsEl.innerHTML = '';
        statsEl.innerHTML = '';
      }
    }

    function renderStats(requests) {
      const statsEl = document.getElementById('stats');
      const pending = requests.filter(r => r.status === 'pending').length;
      const approved = requests.filter(r => r.status === 'approved').length;
      const denied = requests.filter(r => r.status === 'denied').length;

      statsEl.innerHTML = `
        <div class="stat-card">
          <div class="stat-value pending">${pending}</div>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card">
          <div class="stat-value approved">${approved}</div>
          <div class="stat-label">Approved</div>
        </div>
        <div class="stat-card">
          <div class="stat-value denied">${denied}</div>
          <div class="stat-label">Denied</div>
        </div>
      `;
    }

    function renderRequests(requests) {
      const requestsEl = document.getElementById('requests');

      if (requests.length === 0) {
        requestsEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>No requests found</p>
          </div>
        `;
        return;
      }

      // Sort by timestamp (newest first)
      const sortedRequests = [...requests].sort(
        (a, b) => new Date(b.timestamp) - new Date(a.timestamp)
      );

      requestsEl.innerHTML = sortedRequests.map(req => {
        const shortId = req.id.slice(0, 8);
        const time = new Date(req.timestamp).toLocaleString();
        const isPending = req.status === 'pending';

        return `
          <div class="request-card status-${req.status}">
            <div class="request-header">
              <span class="request-id">#${shortId}</span>
              <span class="request-status status-${req.status}">${req.status}</span>
            </div>
            <div class="request-command">${escapeHtml(req.command)}</div>
            <div class="request-reason">${escapeHtml(req.reason)}</div>
            <div class="request-time">${time}</div>
            ${isPending ? `
              <div class="request-actions">
                <button class="btn btn-approve" onclick="handleRequest('${req.id}', 'approve')">
                  ✅ Approve
                </button>
                <button class="btn btn-deny" onclick="handleRequest('${req.id}', 'deny')">
                  🚫 Deny
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function handleRequest(id, action) {
      const buttons = document.querySelectorAll(`[onclick*='${id}']`);
      buttons.forEach(btn => btn.disabled = true);

      try {
        const endpoint = action === 'approve' ? `/approve/${id}` : `/deny/${id}`;
        const response = await fetch(`${API_BASE}${endpoint}`, {
          method: 'POST',
        });

        if (!response.ok) throw new Error(`Failed to ${action} request`);

        await fetchRequests(); // Refresh the list
      } catch (err) {
        console.error(`Error ${action}ing request:`, err);
        alert(`Error: ${err.message}`);
        buttons.forEach(btn => btn.disabled = false);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial load
    fetchRequests();

    // Auto-refresh every 10 seconds
    setInterval(fetchRequests, 10000);
  </script>
</body>
</html>
